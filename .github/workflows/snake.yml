name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Exécuté une fois par jour à minuit
  workflow_dispatch: # Permet de l'exécuter manuellement

# CRUCIAL : Donner la permission d'écrire dans le dépôt
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #  Mis à jour vers v4 (Node.js 20+ compatible)

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ivan-14-dev
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated files to 'output' branch
        uses: crazy-max/ghaction-github-pages@v4 #  Mis à jour vers v4 (Node.js 20+ compatible)
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
